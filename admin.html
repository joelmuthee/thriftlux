<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThriftLux · Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<meta name="theme-color" content="#0d0d0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body style="background:#faf7f2;">

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <h1>Owner Login</h1>
  <p>Enter your admin password</p>
  <div class="field">
    <label>Password</label>
    <input id="loginPassword" type="password" autocomplete="current-password" />
  </div>
  <button class="btn-admin primary" id="loginBtn" style="width:100%">Sign in</button>
  <p id="loginError" style="color:#b00020;font-size:13px;text-align:center;margin-top:12px;display:none;">Wrong password</p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="admin-wrap" style="display:none;">

  <div class="admin-header">
    <h1>ThriftLux Admin</h1>
    <div class="admin-actions">
      <a class="btn-admin" href="index.html" target="_blank">View site →</a>
      <button class="btn-admin danger" id="logoutBtn">Logout</button>
    </div>
  </div>


  <div class="admin-form">
    <h2 id="formTitle">Add a new bag</h2>
    <input type="hidden" id="editingId">

    <div class="field">
      <label>Bag image</label>
      <input id="imageInput" type="file" accept="image/*">
      <div id="imagePreview" style="margin-top:10px;"></div>
      <p style="font-size:12px;color:#999;margin-top:6px;">Image uploads directly to the site repo. Recommended: square crop, ~1080×1080.</p>
    </div>

    <div class="field">
      <label>Bag name</label>
      <input id="nameInput" type="text" placeholder="e.g. Black Quilted Chain Shoulder Bag" required>
    </div>

    <div class="field">
      <label>Description</label>
      <textarea id="descInput" placeholder="Tap 'Suggest with AI' or write your own..."></textarea>
      <button class="btn-admin" id="aiBtn" type="button" style="margin-top:8px;">✨ Suggest description (offline)</button>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Price (Ksh)</label>
        <input id="priceInput" type="number" min="0" step="50" placeholder="1500">
      </div>
      <div class="field">
        <label>Instagram Reel URL (optional)</label>
        <input id="reelInput" type="url" placeholder="https://www.instagram.com/reel/...">
      </div>
    </div>

    <div class="field field-checkbox">
      <input id="soldInput" type="checkbox">
      <label for="soldInput" style="margin:0;">Mark as sold</label>
    </div>

    <div class="admin-actions">
      <button class="btn-admin primary" id="saveBtn">Save bag</button>
      <button class="btn-admin" id="cancelBtn" style="display:none;">Cancel edit</button>
    </div>
  </div>

  <h2 style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500;margin:30px 0 16px;">Existing bags (<span id="bagCount">0</span>)</h2>
  <div class="admin-list" id="adminList"></div>
</div>

<div class="toast" id="toast"></div>

<script src="admin.js?v=2"></script>
</body>
</html>
